[project]
name = "insightflow-backend"
version = "0.1.0"
description = "InsightFlow — AI-Native Telecom Decision Intelligence Platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "httpx>=0.27",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "shap>=0.46",
    "catboost>=1.2",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]  # line-length enforced by ruff format

[tool.ruff.lint.per-file-ignores]
# Architecture checker: uppercase regex collections + nested ifs are deliberate
"scripts/check_architecture.py" = ["N806", "SIM102"]
# Alembic-generated migration files — do not hand-edit for lint
"alembic/versions/*.py" = ["E501", "W291", "E402"]
# ML modules: X_train/y_test etc. follow scikit-learn naming conventions
"app/ml/*.py" = ["N806", "N803"]
"tests/unit/ml/*.py" = ["N806", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term --cov-fail-under=80"
