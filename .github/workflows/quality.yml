name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Backend quality gates
  # ------------------------------------------------------------------
  backend:
    name: Backend — Lint, Type, Test, Architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insightflow
          POSTGRES_PASSWORD: insightflow_test
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: 🏗️ Architecture Rules Check
        run: uv run python scripts/check_architecture.py --json

      - name: 🔍 Lint (Ruff)
        run: uv run ruff check .

      - name: 📝 Format Check
        run: uv run ruff format --check .

      - name: 🔒 Type Check (Mypy)
        run: uv run mypy app/ --strict --ignore-missing-imports

      - name: 🗄️ Apply Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://insightflow:insightflow_test@localhost:5432/insightflow_test
        run: uv run alembic upgrade head

      - name: 🧪 Prepare Test Data (seed + mock + ETL + features)
        env:
          DATABASE_URL: postgresql+asyncpg://insightflow:insightflow_test@localhost:5432/insightflow_test
        run: |
          uv run python scripts/seed_registries.py
          uv run python scripts/generate_mock_data.py --seed 42 --customers 200 --days 10 --months 3 --weeks 2
          uv run python scripts/run_etl.py --input-dir data/mock
          uv run python scripts/generate_features.py
          uv run python -m app.ml.deploy

      - name: 🧪 Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://insightflow:insightflow_test@localhost:5432/insightflow_test
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Frontend quality gates (only when frontend/ changes)
  # ------------------------------------------------------------------
  frontend:
    name: Frontend — Lint, Type, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: frontend_exists
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.frontend_exists.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_exists.outputs.exists == 'true'
        run: cd frontend && npm ci

      - name: 🔍 Lint
        if: steps.frontend_exists.outputs.exists == 'true'
        run: cd frontend && npm run lint

      - name: 🔒 Type Check
        if: steps.frontend_exists.outputs.exists == 'true'
        run: cd frontend && npx tsc --noEmit

      - name: 🧪 Tests
        if: steps.frontend_exists.outputs.exists == 'true'
        run: cd frontend && npm test -- --coverage

      - name: 📊 Upload Coverage
        if: steps.frontend_exists.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # AI prompt regression tests (only when AI agents exist)
  # ------------------------------------------------------------------
  ai-regression:
    name: AI — Prompt Regression Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Check AI modules exist
        id: ai_exists
        run: |
          if [ -d app/ai ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: 🧪 Prompt Regression Tests
        if: steps.ai_exists.outputs.exists == 'true'
        env:
          LLM_PROVIDER: mock  # Use mock LLM — no API key needed in CI
        run: uv run pytest tests/ai/test_prompts/ -v

  # ------------------------------------------------------------------
  # Security scan
  # ------------------------------------------------------------------
  security:
    name: Security — Bandit Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv bandit
          uv sync --frozen

      - name: 🔒 Security Scan (Bandit)
        # B608: dynamic SQL from code constants (FEATURE_COLUMNS/SORTABLE_COLUMNS)
        # with parameterized value binding — reviewed and safe (AR-012).
        run: uv run bandit -r app/ -ll -f json -o bandit-report.json --skip B608

      - name: 📊 Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/bandit-report.json
          if-no-files-found: ignore
